name: Build DAW Presets V2 (Wide Queries)

on:
  workflow_dispatch:   # Trigger manually from GitHub Actions tab

# V2 strategy: simple 2-word queries that reliably find results.
# Does NOT overwrite pads already found by V1 (.preset-cache.json).
# Merges both into daw-presets.json with V1 taking priority.

jobs:
  build-presets-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4
        with:
          ref: V2
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Run V2 preset curation (60 passes, 1/min)
        env:
          FREESOUND_TOKEN: ${{ secrets.FREESOUND_TOKEN || 'd37DSk0vV5S7Cc2DwOaeiuMizrwneXAYz4FBQjqX' }}
        run: |
          echo "Starting V2 preset curation — 60 passes at 1-minute intervals"
          echo "V2 uses 2-word queries; skips pads already vetted by V1"
          for i in $(seq 1 60); do
            echo ""
            echo "═══ V2 Pass $i / 60 ═══"
            node scripts/build-daw-presets-v2.mjs --max-requests 40 || true
            complete=$(node -e "
              const fs = require('fs');
              try {
                const d = JSON.parse(fs.readFileSync('public/daw-presets.json','utf8'));
                const presets = d.presets || {};
                const names = Object.keys(presets);
                const done = names.filter(n => (presets[n]||[]).length >= 32).length;
                console.log(done + '/' + names.length);
                if (done === names.length) process.exit(0); else process.exit(1);
              } catch { process.exit(1); }
            " 2>/dev/null && echo "true" || echo "false")
            echo "  Completion: $complete presets fully built"
            if [ "$complete" = "true" ]; then
              echo "All presets complete — stopping early"
              break
            fi
            if [ $i -lt 60 ]; then
              echo "  Waiting 65s before next pass…"
              sleep 65
            fi
          done

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/daw-presets.json scripts/.preset-cache-v2.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m $'chore: update daw-presets.json via V2 wide queries [skip ci]\n\nCo-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>'
            git push origin V2
          fi
